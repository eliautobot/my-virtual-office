    <style>
        :root { --bg:#0d0d1a; --surface:#141428; --border:#2a2a4a; --gold:#ffd700; --text:#d8d8e8; --text-dim:#8f91aa; --green:#4caf50; --red:#f44336; --blue:#2196f3; --purple:#8b5cf6; }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { background:var(--bg); color:var(--text); font-family:'Press Start 2P', monospace; font-size:8px; line-height:1.6; padding:10px; }
        h1 { font-size:12px; color:var(--gold); margin-bottom:12px; }
        h2 { font-size:9px; color:var(--gold); margin:14px 0 8px; }
        h3 { font-size:8px; color:var(--gold); margin:10px 0 6px; }
        p { margin:5px 0; }
        .back-btn { display:inline-block; padding:6px 12px; background:var(--surface); color:var(--gold); border:1px solid var(--border); border-radius:4px; cursor:pointer; font-family:inherit; font-size:7px; margin-bottom:10px; text-decoration:none; }
        .tabs { display:flex; gap:4px; margin-bottom:12px; flex-wrap:wrap; }
        .tab { padding:6px 10px; background:var(--surface); border:1px solid var(--border); border-radius:4px 4px 0 0; cursor:pointer; font-family:inherit; font-size:7px; color:var(--text-dim); }
        .tab.active { background:var(--border); color:var(--gold); }
        .panel { display:none; }
        .panel.active { display:block; }
        .card { background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:10px; margin-bottom:10px; }
        .provider-header { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px; }
        .provider-header > * { min-width:0; }
        .provider-name { font-size:9px; color:var(--gold); overflow-wrap:anywhere; }
        .provider-current { color:var(--text-dim); text-align:right; max-width:46%; overflow-wrap:anywhere; word-break:break-word; }
        .muted { color:var(--text-dim); }
        .ok { color:var(--green); }
        .err { color:var(--red); }
        .tag { display:inline-block; padding:2px 5px; border:1px solid var(--border); border-radius:3px; margin:2px; color:var(--text-dim); }
        input, select, textarea { font-family:'Press Start 2P', monospace; font-size:7px; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:3px; padding:5px 6px; width:100%; }
        textarea { min-height:64px; resize:vertical; }
        .row { display:flex; gap:6px; align-items:center; margin:6px 0; flex-wrap:wrap; }
        .row label { min-width:102px; color:var(--text-dim); flex-shrink:0; }
        .row input, .row select, .row textarea { flex:1; min-width:190px; }
        .btn { padding:5px 10px; font-family:inherit; font-size:7px; border:none; border-radius:3px; cursor:pointer; white-space:nowrap; margin:2px 2px 2px 0; }
        .btn-gold { background:var(--gold); color:#000; }
        .btn-green { background:var(--green); color:#fff; }
        .btn-red { background:var(--red); color:#fff; }
        .btn-blue { background:var(--blue); color:#fff; }
        .btn-purple { background:var(--purple); color:#fff; }
        .model-list { max-height:280px; overflow-y:auto; margin:6px 0; border:1px solid var(--border); border-radius:4px; }
        .model-item { padding:4px 6px; font-size:7px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; gap:8px; align-items:center; }
        .model-item span { min-width:0; overflow-wrap:anywhere; word-break:break-word; }
        .model-item:last-child { border-bottom:none; }
        .auth-help .model-item { align-items:flex-start; }
        .auth-help .model-item span:first-child { color:var(--gold); }
        .mvw-confirm-overlay { position:fixed; inset:0; z-index:1000; display:grid; place-items:center; padding:18px; background:rgba(5,5,12,.78); }
        .mvw-confirm-overlay[hidden] { display:none; }
        .mvw-confirm-dialog { width:min(460px, 100%); background:var(--surface); border:1px solid var(--gold); border-radius:6px; padding:14px; box-shadow:0 20px 70px rgba(0,0,0,.55); }
        .mvw-confirm-title { color:var(--gold); font-size:9px; margin-bottom:8px; }
        .mvw-confirm-message { color:var(--text); margin-bottom:12px; overflow-wrap:anywhere; }
        .mvw-confirm-actions { display:flex; justify-content:flex-end; gap:6px; flex-wrap:wrap; }
        .status-msg { font-size:7px; margin:6px 0; min-height:12px; }
        .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:10px; }
        .wide { grid-column:1 / -1; }
        .checkbox-row { display:flex; align-items:center; gap:6px; color:var(--text-dim); margin:6px 0; }
        .checkbox-row input { width:auto; min-width:0; }
        .provider-tools { display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
        .model-editor { font-family:monospace; font-size:11px; line-height:1.35; min-height:92px; }
        .context-settings { margin-top:10px; border-top:1px solid var(--border); padding-top:8px; }
        .context-row { display:grid; grid-template-columns:minmax(150px, 1.4fr) minmax(180px, 1fr) minmax(120px, .8fr); gap:6px; align-items:center; padding:6px; border:1px solid var(--border); border-radius:4px; margin:5px 0; }
        .context-model { min-width:0; overflow-wrap:anywhere; }
        .context-model small { display:block; margin-top:4px; color:var(--text-dim); line-height:1.35; }
        .context-row select, .context-row input { min-width:0; }
        .context-row input:disabled { opacity:.65; cursor:not-allowed; }
        @media (max-width:700px) {
            .ui-standalone .models-header .back-btn { display:inline-flex; align-items:center; min-height:44px; }
            .provider-header { flex-direction:column; }
            .provider-current { max-width:100%; text-align:left; }
            .context-row { grid-template-columns:1fr; }
        }
        code { color:var(--gold); overflow-wrap:anywhere; }
        ::-webkit-scrollbar { width:5px; }
        ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

<body class="ui-standalone models-page">
    <div class="models-header">
        <a class="back-btn" href="/"><span aria-hidden="true">←</span> Office</a>
        <a class="back-btn" href="/providers.html">Agent Providers</a>
        <h1>Models &amp; providers</h1>
        <button type="button" class="ui-theme-toggle" data-ui-theme-toggle>Light</button>
    </div>
    <div class="tabs" role="tablist" aria-label="Model settings sections">
        <button type="button" class="tab active" role="tab" id="tab-openclaw" data-tab="openclaw" aria-selected="true" aria-controls="panel-openclaw">OpenClaw</button>
        <button type="button" class="tab" role="tab" id="tab-hermes" data-tab="hermes" aria-selected="false" aria-controls="panel-hermes" tabindex="-1">Hermes</button>
        <button type="button" class="tab" role="tab" id="tab-codex" data-tab="codex" aria-selected="false" aria-controls="panel-codex" tabindex="-1">Codex</button>
        <button type="button" class="tab" role="tab" id="tab-claude-code" data-tab="claude-code" aria-selected="false" aria-controls="panel-claude-code" tabindex="-1">Claude Code</button>
        <button type="button" class="tab" role="tab" id="tab-setup" data-tab="setup" aria-selected="false" aria-controls="panel-setup" tabindex="-1">Native setup</button>

        <div class="mvw-confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="mvw-confirm-title">
            <div id="mvw-confirm-title" class="mvw-confirm-title">Confirm Action</div>
            <div id="mvw-confirm-message" class="mvw-confirm-message"></div>
            <div class="mvw-confirm-actions">
                <button id="mvw-confirm-cancel" class="btn" type="button">Cancel</button>
                <button id="mvw-confirm-ok" class="btn btn-red" type="button">Continue</button>
            </div>

<script>
(function () {
'use strict';
let nativeData = null;
let pendingScrollRestore = null;
let activeConfirmResolve = null;
let confirmOpener = null;
let loadSeq = 0;
const PANEL_ROOTS = { openclaw: 'openclaw-models', hermes: 'hermes-models', codex: 'codex-models', 'claude-code': 'claude-code-models', setup: 'native-setup' };
const CLAUDE_PERMISSION_MODES = [
    ['acceptEdits', 'Accept edits'],
    ['default', 'Default (ask)'],
    ['plan', 'Plan only'],
    ['bypassPermissions', 'Bypass permissions'],
];
const CODEX_SANDBOX = [['workspace-write', 'workspace-write'], ['read-only', 'read-only'], ['danger-full-access', 'danger-full-access']];
const CODEX_APPROVAL = [['untrusted', 'untrusted (Ask first)'], ['on-request', 'on-request'], ['on-failure', 'on-failure'], ['never', 'never (Full access)']];

function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function val(id) {
    const el = document.getElementById(id);
    return el ? el.value.trim() : '';
}

function checked(id) {
    return !!document.getElementById(id)?.checked;
}

function setStatus(id, data, okText = 'Saved') {
    const el = document.getElementById(id);
    if (!el) return;
    el.className = 'status-msg ' + (data.ok ? 'ok' : 'err');
    el.setAttribute('role', data.ok ? 'status' : 'alert');
    el.textContent = data.ok ? okText : (data.error || 'Failed');
}

function setPending(id, text) {
    const el = document.getElementById(id);
    if (!el) return;
    el.className = 'status-msg muted';
    el.removeAttribute('role');
    el.textContent = text;
}

// Options for a select; a current value the list does not know is kept as "(current)".
function selectOptions(pairs, current) {
    const known = pairs.some(([value]) => value === current);
    const rows = pairs.map(([value, label]) => `<option value="${esc(value)}" ${value === current ? 'selected' : ''}>${esc(label)}</option>`);
    if (current && !known) rows.unshift(`<option value="${esc(current)}" selected>${esc(current)} (current)</option>`);
    return rows.join('');
}

function restoreScrollSoon(state) {
    if (!state) return;
    requestAnimationFrame(() => {
        window.scrollTo(state.x || 0, state.y || 0);
        requestAnimationFrame(() => window.scrollTo(state.x || 0, state.y || 0));
    });
}

function refreshNativeSoon(delay = 800) {
    const scrollState = { x: window.scrollX || 0, y: window.scrollY || 0 };
    setTimeout(() => reloadNative({ preserveScroll: scrollState, quiet: true }), delay);
}

function closeConfirmDialog(result) {
    const overlay = document.getElementById('mvw-confirm-overlay');
    if (overlay) overlay.hidden = true;
    const resolve = activeConfirmResolve;
    activeConfirmResolve = null;
    if (confirmOpener && confirmOpener.isConnected) confirmOpener.focus({ preventScroll: true });
    confirmOpener = null;
    if (resolve) resolve(Boolean(result));
}

function confirmAction(message, options = {}) {
    const overlay = document.getElementById('mvw-confirm-overlay');
    const titleEl = document.getElementById('mvw-confirm-title');
    const messageEl = document.getElementById('mvw-confirm-message');
    const cancelEl = document.getElementById('mvw-confirm-cancel');
    const okEl = document.getElementById('mvw-confirm-ok');
    if (!overlay || !titleEl || !messageEl || !cancelEl || !okEl) {
        return Promise.resolve(false);
    }
    if (activeConfirmResolve) closeConfirmDialog(false);
    confirmOpener = document.activeElement;
    titleEl.textContent = options.title || 'Confirm Action';
    messageEl.textContent = message || 'Continue?';
    cancelEl.textContent = options.cancelText || 'Cancel';
    okEl.textContent = options.okText || 'Continue';
    okEl.className = 'btn ' + (options.danger === false ? 'btn-green' : 'btn-red');
    overlay.hidden = false;
    cancelEl.focus({ preventScroll:true });
    return new Promise(resolve => {
        activeConfirmResolve = resolve;
    });
}

document.getElementById('mvw-confirm-cancel')?.addEventListener('click', () => closeConfirmDialog(false));
document.getElementById('mvw-confirm-ok')?.addEventListener('click', () => closeConfirmDialog(true));
document.getElementById('mvw-confirm-overlay')?.addEventListener('click', event => {
    if (event.target === event.currentTarget) closeConfirmDialog(false);
});
document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && activeConfirmResolve) closeConfirmDialog(false);
});

// ---------- tabs (buttons, arrow keys, #hash deep links) ----------
function tabButtons() { return Array.from(document.querySelectorAll('.tabs .tab')); }

function showTab(name, opts = {}) {
    if (!PANEL_ROOTS[name]) name = 'openclaw';
    tabButtons().forEach(t => {
        const on = t.dataset.tab === name;
        t.classList.toggle('active', on);
        t.setAttribute('aria-selected', on ? 'true' : 'false');
        t.tabIndex = on ? 0 : -1;
        if (on && opts.focus) t.focus();
    });
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + name));
    if (opts.updateHash !== false && location.hash !== '#' + name) history.replaceState(null, '', '#' + name);
}

document.querySelector('.tabs')?.addEventListener('click', event => {
    const tab = event.target.closest('.tab');
    if (tab) showTab(tab.dataset.tab);
});
document.querySelector('.tabs')?.addEventListener('keydown', event => {
    const tabs = tabButtons();
    const i = tabs.indexOf(document.activeElement);
    if (i < 0) return;
    let next = -1;
    if (event.key === 'ArrowRight') next = (i + 1) % tabs.length;
    else if (event.key === 'ArrowLeft') next = (i - 1 + tabs.length) % tabs.length;
    else if (event.key === 'Home') next = 0;
    else if (event.key === 'End') next = tabs.length - 1;
    if (next < 0) return;
    event.preventDefault();
    showTab(tabs[next].dataset.tab, { focus: true });
});
window.addEventListener('hashchange', () => showTab(location.hash.slice(1), { updateHash: false }));

// ---------- loading, errors ----------
function stateCard(kind, title, body, opts = {}) {
    // Pixel icons (the page has no sprite): warn / info, never emoji (UI-07).
    const icon = kind === 'error' ? '<svg viewBox="0 0 10 10" width="28" height="28" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M4 0h2v1h-2zM4 1h2v1h-2zM3 2h4v1h-4zM3 3h1v1h-1zM6 3h1v1h-1zM4 3h2v3h-2zM2 4h1v2h-1zM7 4h1v2h-1zM1 6h1v2h-1zM8 6h1v2h-1zM4 7h2v1h-2zM0 8h1v1h-1zM9 8h1v1h-1zM0 9h10v1h-10z"/></svg>' : kind === 'loading' ? '' : '<svg viewBox="0 0 10 10" width="28" height="28" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M2 0h6v1h-6zM1 1h1v1h-1zM8 1h1v1h-1zM0 2h1v6h-1zM9 2h1v6h-1zM1 8h1v1h-1zM8 8h1v1h-1zM2 9h6v1h-6zM4 2h2v1h-2zM3 4h3v1h-3zM4 5h2v2h-2zM3 7h4v1h-4z"/></svg>';
    return `<section class="vo-state-card is-${esc(kind)}" role="${kind === 'error' ? 'alert' : 'status'}">
        ${kind === 'loading' ? '<div class="vo-state-spinner" aria-hidden="true"></div>' : `<div class="vo-state-icon" aria-hidden="true">${icon}</div>`}
        <h2 class="vo-state-title">${esc(title)}</h2>
        ${body ? `<p class="vo-state-body">${esc(body)}</p>` : ''}
        ${opts.raw ? `<details class="vo-state-details"><summary>Technical details</summary><code>${esc(opts.raw)}</code></details>` : ''}
        ${opts.retry ? '<div class="vo-state-actions"><button type="button" class="vo-state-btn is-primary" data-action="reload">↻ Retry</button></div>' : ''}
    </section>`;
}

function setAllPanels(html) {
    Object.values(PANEL_ROOTS).forEach(id => { const el = document.getElementById(id); if (el) el.innerHTML = html; });
}

class LoadError extends Error {
    constructor(message, detail) { super(message); this.detail = detail || ''; }
}

async function fetchNativeModels() {
    let res;
    try {
        res = await fetch('/api/native-models?agent=main', { cache:'no-store', credentials:'same-origin' });
    } catch (e) {
        throw new LoadError('Could not reach this office server. Check that Virtual Office is running.', e && e.message);
    }
    const text = await res.text().catch(() => '');
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (_) { data = null; }
    if (!res.ok) {
        const detail = data && (data.error?.message || data.error) ? String(data.error?.message || data.error) : text.slice(0, 400);
        throw new LoadError(`The server could not read the model settings (error ${res.status}).`, detail || `HTTP ${res.status}`);
    }
    if (!data || typeof data !== 'object') {
        throw new LoadError('The server sent an empty answer for the model settings.', `HTTP ${res.status}, ${text.length} bytes`);
    }
    return data;
}

// Unsaved edits survive a redraw (v0.10.1 saves): an action in one panel reloads every
// panel, which used to reset what was typed in the others. Edited fields (by id) are put
// back after each render; one that now shows the typed value (saved) is forgotten.
const editedFields = new Map();
function fieldState(el) {
    return (el.type === 'checkbox' || el.type === 'radio') ? { checked: el.checked } : { value: el.value };
}
function rememberEdit(event) {
    const el = event.target;
    if (!el || !el.id || !/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName)) return;
    editedFields.set(el.id, fieldState(el));
}
document.addEventListener('input', rememberEdit, true);
document.addEventListener('change', rememberEdit, true);
function restoreEdits(root) {
    if (!root) return;
    editedFields.forEach((saved, id) => {
        const el = document.getElementById(id);
        if (!el || !root.contains(el)) return;
        if (JSON.stringify(fieldState(el)) === JSON.stringify(saved)) { editedFields.delete(id); return; }
        if ('checked' in saved) el.checked = saved.checked; else el.value = saved.value;
    });
}

function renderSafely(name, fn) {
    const root = document.getElementById(PANEL_ROOTS[name]);
    try { fn(); restoreEdits(root); }
    catch (e) {
        console.error('[models] render failed:', name, e);
        if (root) root.innerHTML = stateCard('error', 'This section could not be shown', 'Part of the settings came back in a shape this page does not understand.', { raw: e && e.message, retry: true });
    }
}

async function loadNativeModels() {
    const seq = ++loadSeq;
    const data = await fetchNativeModels();
    if (seq !== loadSeq) return;
    nativeData = data;
    renderSafely('openclaw', renderOpenClaw);
    renderSafely('hermes', renderHermes);
    loadAgentProviders();
    renderSafely('codex', renderCodex);
    renderSafely('claude-code', renderClaudeCode);
    renderSafely('setup', renderSetup);
    if (pendingScrollRestore) {
        const state = pendingScrollRestore;
        pendingScrollRestore = null;
        restoreScrollSoon(state);
    }
}

function reloadNative(options = {}) {
    if (options.preserveScroll) pendingScrollRestore = options.preserveScroll;
    if (!options.quiet || !nativeData) setAllPanels(stateCard('loading', 'Loading model settings…', ''));
    return loadNativeModels().catch(e => {
        if (options.quiet && nativeData) {
            console.warn('[models] refresh failed:', e);
            return;
        }
        setAllPanels(stateCard('error', 'Model settings could not be loaded', e.message || String(e), { raw: e.detail, retry: true }));
    });
}

// ---------- rendering ----------
function modelOptions(models, current, providerFilter) {
    const filtered = (models || [])
        .filter(m => !providerFilter || m.provider === providerFilter)
        .filter(m => !m.missing)
        .sort((a,b) => (String(a.provider) + a.name).localeCompare(String(b.provider) + b.name));
    let found = false;
    const rows = filtered.map(m => {
        const label = (m.provider ? m.provider + '/' : '') + (m.name || m.id);
        if (m.id === current) found = true;
        return `<option value="${esc(m.id)}" ${m.id === current ? 'selected' : ''}>${esc(label)}</option>`;
    });
    if (current && !found) rows.unshift(`<option value="${esc(current)}" selected>${esc(current)} (current)</option>`);
    return rows.join('');
}

function providerOptions(providers, current) {
    return (providers || []).slice().sort().map(p => `<option value="${esc(p)}" ${p === current ? 'selected' : ''}>${esc(p)}</option>`).join('');
}

function authIssueText(row) {
    const bits = [];
    if ((row.missingManagedStatic || []).length) bits.push('missing ' + row.missingManagedStatic.length);
    if ((row.divergentManagedStatic || []).length) bits.push('stale ' + row.divergentManagedStatic.length);
    if ((row.extraStaticProfiles || []).length) bits.push('extra ' + row.extraStaticProfiles.length);
    if (!bits.length) return 'static profiles synced';
    return bits.join(' · ');
}

function profileListText(values) {
    return (values || []).length ? values.join(', ') : 'none';
}

function syncedManagedProfileIds(row, profiles) {
    const profileIds = profiles.map(p => p.id).filter(Boolean);
    const missing = new Set(row.missingManagedStatic || []);
    const stale = new Set(row.divergentManagedStatic || []);
    return profileIds.filter(id => !missing.has(id) && !stale.has(id));
}

function renderOpenClawManagedAuth(oc) {
    const managed = oc.managedAuth || {};
    const rows = managed.agentRows || [];
    const profiles = managed.managedStaticProfiles || [];
    const driftRows = rows.filter(row => row.agent !== 'main' && !row.staticInSync);
    return `<div class="card wide">
        <div class="provider-header">
            <div>
                <div class="provider-name">Virtual Office Global Auth</div>
                <div class="muted">Source <code>${esc(managed.sourceAgent || 'main')}</code> · ${profiles.length} managed static profile${profiles.length === 1 ? '' : 's'} · ${driftRows.length} agent${driftRows.length === 1 ? '' : 's'} need sync</div>
            </div>

function modelsText(models) {
    return (models || []).map(m => m.id || m.name || '').filter(Boolean).join('\n');

function formatContextLimit(value) {
    const tokens = Number(value || 0);
    return Number.isFinite(tokens) && tokens > 0 ? Math.round(tokens).toLocaleString() + ' tokens' : 'unknown';
}

function isOpenClawModelActive(providerId, modelId) {
    const oc = nativeData?.openclaw || {};
    const fullId = String(modelId || '').includes('/') ? String(modelId) : String(providerId || '') + '/' + String(modelId || '');
    if (oc.defaultModel === fullId || oc.runtimeDefaultModel === fullId) return true;
    return Object.values(oc.agents || {}).some(agent => agent?.model === fullId);
}

function renderOllamaContextControls(provider, providerIndex) {
    if (!provider.isOllama) return '';
    const models = provider.models || [];
    if (!models.length) return '';
    return `<div class="context-settings">
        <h3>Ollama Context Limits</h3>
        <p class="muted">Model default reads the advertised limit from Ollama. Manual override caps both OpenClaw's context budget and Ollama's runtime <code>num_ctx</code>.</p>
        ${models.map((model, modelIndex) => {
            const advertised = Number(model.advertisedContextWindow || 0);
            const configured = Number(model.contextWindow || 0);
            const manual = model.contextMode === 'manual';
            const inputValue = manual ? Number(model.manualContextWindow || configured || 0) : Number(advertised || configured || 0);
            const active = isOpenClawModelActive(provider.provider, model.id);
            const autoLabel = advertised ? `Model default (${advertised.toLocaleString()})` : 'Model default (unavailable)';
            const detail = advertised
                ? `Advertised: ${formatContextLimit(advertised)} · Configured: ${formatContextLimit(configured)}`
                : `Configured: ${formatContextLimit(configured)}${model.contextDetectionError ? ' · Detection: ' + model.contextDetectionError : ''}`;
            return `<div class="context-row">
                <div class="context-model"><span>${esc(model.id)}${active ? ' · ACTIVE' : ''}</span><small>${esc(detail)}</small></div>
                <select id="oc-context-mode-${providerIndex}-${modelIndex}" data-change="context-mode" data-provider-index="${providerIndex}" data-model-index="${modelIndex}" aria-label="Context mode for ${esc(model.id)}">
                    <option value="auto" ${manual ? '' : 'selected'} ${!advertised && manual ? 'disabled' : ''}>${esc(autoLabel)}</option>
                    <option value="manual" ${manual ? 'selected' : ''}>Manual override</option>
                </select>
                <input id="oc-context-value-${providerIndex}-${modelIndex}" type="number" min="1024" step="1024" ${advertised ? `max="${esc(advertised)}"` : ''} value="${esc(inputValue || '')}" ${manual ? '' : 'disabled'} aria-label="Context limit for ${esc(model.id)}">
            </div>`;
        }).join('')}
    </div>`;
}

function toggleOllamaContextOverride(providerIndex, modelIndex) {
    const mode = val(`oc-context-mode-${providerIndex}-${modelIndex}`);
    const input = document.getElementById(`oc-context-value-${providerIndex}-${modelIndex}`);
    if (!input) return;
    input.disabled = mode !== 'manual';
    if (mode === 'manual' && !Number(input.value || 0)) {
        const provider = ((nativeData?.openclaw || {}).localProviders || [])[providerIndex] || {};
        const model = (provider.models || [])[modelIndex] || {};
        input.value = Number(model.contextWindow || model.advertisedContextWindow || 0) || '';
    }
}

// Keeps each existing model's display name (CH-34); new ids get their id as name.
function openClawProviderModelsPayload(index) {
    const provider = ((nativeData?.openclaw || {}).localProviders || [])[index] || {};
    const rawModelIds = val('oc-local-provider-models-' + index).replace(/,/g, '\n').split(/\r?\n/).map(value => value.trim()).filter(Boolean);
    const existingIndex = new Map((provider.models || []).map((model, modelIndex) => [model.id, modelIndex]));
    return [...new Set(rawModelIds)].map(modelId => {
        const modelIndex = existingIndex.get(modelId);
        const model = modelIndex === undefined ? {} : (provider.models[modelIndex] || {});
        const payload = { id:modelId, name:model.name || modelId };
        if (!provider.isOllama) return payload;
        if (modelIndex === undefined) return Object.assign(payload, { contextMode:'auto' });
        const mode = val(`oc-context-mode-${index}-${modelIndex}`) === 'manual' ? 'manual' : 'auto';
        payload.contextMode = mode;
        if (mode === 'manual') {
            const contextWindow = Number(val(`oc-context-value-${index}-${modelIndex}`));
            if (!Number.isInteger(contextWindow) || contextWindow < 1024) {
                throw new Error(`Enter a manual context of at least 1,024 tokens for ${modelId}.`);
            }
            payload.contextWindow = contextWindow;
        }
        return payload;
    });
}

function localProviderSummary(provider) {

    if (provider.apiKeyConfigured) bits.push('API key saved');
    return bits.join(' · ') || 'No extra settings';
}

let apRows = null;

async function loadAgentProviders() {
    try {
        const res = await fetch('/api/agent-providers', { cache:'no-store' });
        const data = res.ok ? await res.json() : null;
        apRows = data && Array.isArray(data.providers) ? data.providers.filter(p => p && p.id) : null;

    if (!p) return '';

// ---------- saving ----------
// Never throws: network errors, non-JSON and HTTP errors all come back as {ok:false, error}.
async function postJson(url, body) {
    let res;
    try {
        res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'same-origin', body:JSON.stringify(body) });
    } catch (e) {
        return { ok:false, error:'Could not reach this office server.' };
    }
    const text = await res.text().catch(() => '');
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (_) { data = null; }
    if (!data || typeof data !== 'object') {
        return { ok:false, error: res.ok ? 'The server sent an unreadable answer.' : `The request failed (HTTP ${res.status}).` };
    }
    if (!res.ok) data.ok = false;
    if (data.error && typeof data.error === 'object') data.error = data.error.message || data.error.code || JSON.stringify(data.error);
    if (data.ok === false && !data.error) data.error = `The request failed (HTTP ${res.status}).`;
    if (data.ok === undefined) data.ok = res.ok;
    return data;
}

// One action at a time per button: disabled while pending, status line updated before and after.
async function runAction(btn, statusId, pendingText, work) {
    if (btn && btn.dataset.busy === '1') return;
    if (btn) { btn.dataset.busy = '1'; btn.disabled = true; btn.setAttribute('aria-busy', 'true'); }
    if (statusId && pendingText) setPending(statusId, pendingText);
    try {
        await work();
    } catch (e) {
        if (statusId) setStatus(statusId, { ok:false, error: e && e.message ? e.message : String(e) });
    } finally {
        if (btn && btn.isConnected) { delete btn.dataset.busy; btn.disabled = false; btn.removeAttribute('aria-busy'); }
    }
}

// Only fields that differ from what the server reported, so unknown values are never rewritten.
function changedFields(payload, current) {
    const out = {};
    for (const [key, value] of Object.entries(payload)) {
        const before = current ? current[key] : undefined;
        const norm = v => (v === null || v === undefined ? '' : v);
        if (typeof value === 'boolean') { if (value !== (before !== false)) out[key] = value; }
        else if (norm(value) !== norm(before)) out[key] = value;
    }
    return out;
}

function countText(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }

// A test never runs a program path it is sent (the server takes it from the saved settings only), so a CLI path typed
// here and not saved yet is not what the test ran: say so next to the result.
function unsavedPathNote(payload, current) {
    return Object.prototype.hasOwnProperty.call(changedFields({ binary: payload.binary }, current), 'binary')
        ? ' The CLI path you typed is used once you save; this test ran the saved one (or the one on PATH).' : '';
}
function withPathNote(data, okText, note) {
    if (!note) return okText;
    if (!data.ok) data.error = (data.error || 'Failed') + note;
    return okText + note;
}

const actions = {
    'reload': () => reloadNative(),
    'sync-static': (btn) => runAction(btn, 'oc-managed-auth-status', 'Syncing…', async () => {
        const data = await postJson('/api/native-models/openclaw/auth/sync-static', {});
        setStatus('oc-managed-auth-status', data, 'Synced static profiles to ' + countText(data.touchedAgents || 0, 'agent store'));
        if (data.ok) refreshNativeSoon();
    }),
    'reset-overrides': async (btn) => {
        const agentId = btn.dataset.agent;
        if (!agentId || !(await confirmAction(
            'Reset static auth overrides for ' + agentId + '? Managed static profiles will be copied from main and extra static overrides will be removed. OAuth profiles are left alone.',
            { title:'Reset Static Overrides', okText:'Reset Overrides' }
        ))) return;
        return runAction(btn, 'oc-managed-auth-status', 'Resetting…', async () => {
            const data = await postJson('/api/native-models/openclaw/auth/reset-overrides', { agent: agentId });
            setStatus('oc-managed-auth-status', data, 'Reset static overrides for ' + agentId);
            if (data.ok) refreshNativeSoon();
        });
    },
    'save-local-provider': (btn) => {
        const index = Number(btn.dataset.index);
        const statusId = 'oc-local-provider-status-' + index;
        return runAction(btn, statusId, 'Saving…', async () => {
            const timeoutRaw = val('oc-local-provider-timeout-' + index);
            const timeout = timeoutRaw ? Number(timeoutRaw) : null;
            if (timeoutRaw && (!Number.isFinite(timeout) || timeout < 1)) throw new Error('Timeout must be a positive number of seconds.');
            const body = {
                provider: val('oc-local-provider-id-' + index),
                baseUrl: val('oc-local-provider-url-' + index),
                api: val('oc-local-provider-api-' + index),
                apiKey: val('oc-local-provider-key-' + index),
                timeoutSeconds: timeout,
                models: openClawProviderModelsPayload(index)
            };
            const data = await postJson('/api/native-models/openclaw/provider', body);
            setStatus(statusId, data, 'Saved ' + (data.provider || body.provider));
            if (data.ok) {
                const keyEl = document.getElementById('oc-local-provider-key-' + index);
                if (keyEl) keyEl.value = '';
                refreshNativeSoon();
            }
        });
    },
    'delete-local-provider': (btn) => {
        const index = Number(btn.dataset.index);
        const provider = (((nativeData?.openclaw || {}).localProviders || [])[index] || {}).provider;
        return deleteOpenClawProviderById(btn, provider, 'oc-local-provider-status-' + index);
    },
    'delete-provider': (btn) => deleteOpenClawProviderById(btn, val('oc-delete-provider'), 'oc-delete-status'),
    'save-provider': (btn) => runAction(btn, 'oc-provider-status', 'Saving…', async () => {
        const provider = val('oc-provider-id');
        if (!provider) throw new Error('Enter a provider ID.');
        const data = await postJson('/api/native-models/openclaw/provider', { provider, baseUrl:val('oc-provider-url'), api:val('oc-provider-api'), apiKey:val('oc-provider-key'), models:val('oc-provider-models') });
        setStatus('oc-provider-status', data, 'Saved ' + (data.provider || 'provider'));
        if (data.ok) { document.getElementById('oc-provider-key').value = ''; refreshNativeSoon(); }
    }),
    'save-cloud-key': (btn) => {
        const index = Number(btn.dataset.index);
        const statusId = 'oc-cloud-status-' + index;
        return runAction(btn, statusId, 'Saving…', async () => {
            const provider = ((nativeData?.openclaw || {}).cloudProviders || [])[index] || {};
            const apiKey = val('oc-cloud-key-' + index);
            if (!apiKey) throw new Error('Paste an API key first.');
            const data = await postJson('/api/native-models/openclaw/auth/api-key', { scope: 'global', provider: provider.provider || '', profileId: val('oc-cloud-profile-' + index), apiKey });
            setStatus(statusId, data, 'Saved globally ' + (data.profileId || data.provider || ''));
            if (data.ok) {
                const keyEl = document.getElementById('oc-cloud-key-' + index);
                if (keyEl) keyEl.value = '';
                refreshNativeSoon();
            }
        });
    },
    'delete-cloud-key': async (btn) => {
        const index = Number(btn.dataset.index);
        const statusId = 'oc-cloud-status-' + index;
        const provider = ((nativeData?.openclaw || {}).cloudProviders || [])[index] || {};
        const profileId = val('oc-cloud-delete-' + index);
        if (!profileId || !(await confirmAction('Delete OpenClaw auth profile ' + profileId + ' from all agents?', { title:'Delete Auth Profile', okText:'Delete Profile' }))) return;
        return runAction(btn, statusId, 'Deleting…', async () => {
            const data = await postJson('/api/native-models/openclaw/auth/delete', { scope:'global', provider: provider.provider || '', profileId });
            setStatus(statusId, data, 'Deleted globally ' + profileId);
            if (data.ok) refreshNativeSoon();
        });
    },
    'set-agent-model': (btn) => {
        const agentId = btn.dataset.agent;
        const index = btn.dataset.index;
        const statusId = 'oc-agent-status-' + index;
        return runAction(btn, statusId, 'Applying…', async () => {
            const selectedModel = val('oc-agent-' + index);
            const data = await postJson('/api/native-models/openclaw/agent-model', { agent:agentId, model:selectedModel });
            setStatus(statusId, data, 'Applied');
            if (!data.ok) return;
            try {
                if (window.parent && window.parent !== window) {
                    window.parent.dispatchEvent(new CustomEvent('vo:agent-model-changed', {
                        detail: { agentId, providerKind: 'openclaw', model: data.model || selectedModel || '', defaulted: Boolean(data.defaulted) }
                    }));
                    window.parent.dispatchEvent(new CustomEvent('vo:agents-changed', { detail: { reason: 'model-changed', agentId } }));
                }
            } catch (_) {}
            refreshNativeSoon();
        });
    },
    'save-codex': (btn) => runAction(btn, 'setup-codex-status', 'Saving…', async () => {
        const changes = changedFields(codexSetupPayload(), nativeData?.codex);
        if (!Object.keys(changes).length) { setStatus('setup-codex-status', { ok:true }, 'Nothing changed'); return; }
        const data = await postJson('/setup/save', { codex: changes });
        setStatus('setup-codex-status', data, 'Codex setup saved');
        if (data.ok) refreshNativeSoon();
    }),
    'test-codex': (btn) => runAction(btn, 'setup-codex-status', 'Testing Codex CLI with the values in this form…', async () => {
        const payload = codexSetupPayload();
        const note = unsavedPathNote(payload, nativeData?.codex);
        const data = await postJson('/api/codex/test', payload);
        const agents = (data.agents || []).length;
        setStatus('setup-codex-status', data, withPathNote(data, 'Codex connected · ' + (data.protocol || 'codex') + ' · ' + countText(agents, 'agent') + ' (not saved)', note));
    }),
    'save-claude': (btn) => runAction(btn, 'setup-claude-status', 'Saving…', async () => {
        const changes = changedFields(claudeCodeSetupPayload(), nativeData?.claudeCode);
        if (!Object.keys(changes).length) { setStatus('setup-claude-status', { ok:true }, 'Nothing changed'); return; }
        const data = await postJson('/setup/save', { claudeCode: changes });
        setStatus('setup-claude-status', data, 'Claude Code setup saved');
        if (data.ok) refreshNativeSoon();
    }),
    'open-ap': (btn) => { window.open(btn.dataset.href || '/providers.html?provider=hermes', '_blank', 'noopener'); },
    'test-claude': (btn) => runAction(btn, 'setup-claude-status', 'Testing Claude Code CLI with the values in this form…', async () => {
        const payload = claudeCodeSetupPayload();
        const note = unsavedPathNote(payload, nativeData?.claudeCode);
        const data = await postJson('/api/claude-code/test', payload);
        setStatus('setup-claude-status', data, withPathNote(data, 'Claude Code connected · found ' + countText((data.agents || []).length, 'agent') + ' (not saved)', note));
    }),
};

async function deleteOpenClawProviderById(btn, provider, statusId) {
    if (!provider || !(await confirmAction('Delete OpenClaw provider ' + provider + '? Agents that use its models fall back to the default model.', { title:'Delete Provider', okText:'Delete Provider' }))) return;
    return runAction(btn, statusId, 'Deleting…', async () => {
        const data = await postJson('/api/native-models/openclaw/provider/delete', { provider });
        setStatus(statusId, data, 'Deleted ' + provider);
        if (data.ok) refreshNativeSoon();
    });
}

document.addEventListener('click', event => {
    const btn = event.target.closest('[data-action]');
    if (!btn || btn.closest('#mvw-confirm-overlay')) return;
    const handler = actions[btn.dataset.action];
    if (!handler) return;
    event.preventDefault();
    handler(btn);
});

document.addEventListener('change', event => {
    const el = event.target;
    if (!el || !el.dataset) return;
    if (el.dataset.change === 'context-mode') toggleOllamaContextOverride(Number(el.dataset.providerIndex), Number(el.dataset.modelIndex));
    else if (el.dataset.change === 'provider-preset') fillOpenClawPreset();

reloadNative();
